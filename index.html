<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шар принятия решений</title>
<meta name="theme-color" content="#14103A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Шар">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EEFF; --ink:#0A0820; --soft:#2B2650; --accent:#5B3FFF; --chip:#FFFFFF; --chipOn:#0A0820; --chipOnInk:#FFFFFF; --star:#5B3FFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14103A; --ink:#FFFFFF; --soft:#E4E0FF; --accent:#FFD45C; --chip:#241E5C; --chipOn:#FFD45C; --chipOnInk:#14103A; --star:#FFD45C;
  }
}
:root[data-theme="dark"]{
  --bg:#14103A; --ink:#FFFFFF; --soft:#E4E0FF; --accent:#FFD45C; --chip:#241E5C; --chipOn:#FFD45C; --chipOnInk:#14103A; --star:#FFD45C;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
}
main{width:100%;max-width:440px;padding:20px 18px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;flex:1}
h1{
  font-family:Unbounded,Manrope,system-ui,sans-serif; font-weight:800;
  font-size:clamp(26px,8vw,34px); line-height:1.05; letter-spacing:-.02em;
  margin:6px 0 0; text-align:center;
}
h1 small{display:block;font-size:.5em;font-weight:600;color:var(--accent);letter-spacing:0;margin-top:6px}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.modes button{
  font:700 15px Manrope,system-ui,sans-serif; color:var(--ink); background:var(--chip);
  border:2px solid var(--ink); border-radius:999px; padding:9px 16px; cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.q{
  width:100%; font:600 17px Manrope,system-ui,sans-serif; color:var(--ink);
  background:var(--chip); border:2px solid var(--ink); border-radius:14px; padding:13px 14px;
}
.q::placeholder{color:var(--soft);opacity:1}
.stage{position:relative;width:min(84vw,330px);aspect-ratio:1;margin-top:6px}
.ball{
  position:absolute;inset:0;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:
    radial-gradient(circle at 32% 26%,rgba(255,255,255,.55) 0 6%,rgba(255,255,255,0) 18%),
    radial-gradient(circle at 50% 55%,#2a2a33 0%,#000 70%);
  box-shadow:0 26px 40px -18px rgba(0,0,0,.6), inset -14px -20px 40px rgba(0,0,0,.8);
  display:grid;place-items:center;
}
.ball:focus-visible{outline:4px solid var(--accent);outline-offset:6px}
.window{
  width:52%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#10107a,#03031f 72%);
  box-shadow:inset 0 0 0 6px #0b0b0f, inset 0 8px 18px rgba(0,0,0,.9);
  display:grid;place-items:center;overflow:hidden;
}
.eight{font:800 clamp(56px,18vw,84px) Unbounded,system-ui,sans-serif;color:#fff;
  background:#fff;color:#000;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;line-height:1}
.tri{
  width:92%;aspect-ratio:1/0.87;background:#2F3BFF;
  clip-path:polygon(50% 100%,0 0,100% 0);
  display:flex;align-items:flex-start;justify-content:center;
  padding:9% 16% 0;
  opacity:0;transform:scale(.6) rotate(-8deg);transition:opacity .5s ease,transform .5s ease;
}
.tri.show{opacity:1;transform:none}
.tri span{
  color:#FFFFFF;font:800 clamp(11px,3.3vw,14px)/1.15 Manrope,system-ui,sans-serif;
  text-align:center;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere;
}
.shake{animation:shake .9s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-3px,1px) rotate(-2deg)}
  20%,80%{transform:translate(7px,-4px) rotate(4deg)}
  30%,50%,70%{transform:translate(-12px,5px) rotate(-6deg)}
  40%,60%{transform:translate(12px,-5px) rotate(6deg)}
}
.hint{font-weight:700;font-size:16px;color:var(--ink);text-align:center;margin:0;min-height:1.4em}
.answer{font:800 22px/1.25 Unbounded,system-ui,sans-serif;text-align:center;margin:0;min-height:2.6em;color:var(--ink)}
.hist{width:100%;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hist li{font-size:15px;color:var(--ink);border-left:4px solid var(--accent);padding:4px 10px;background:var(--chip);border-radius:0 8px 8px 0}
.hist li b{display:block;color:var(--soft);font-weight:600;font-size:13px}
.foot{font-size:13px;color:var(--soft);text-align:center;margin-top:auto}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.tri{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Шар принятия решений<small>Задай вопрос и тряхни</small></h1>

  <div class="modes" role="group" aria-label="Режим">
    <button data-mode="classic" aria-pressed="true">Классика</button>
    <button data-mode="rodblok" aria-pressed="false">Родблок</button>
    <button data-mode="astro" aria-pressed="false">Астролог</button>
  </div>

  <input class="q" id="q" type="text" maxlength="120" placeholder="Например: брать дежурство 31-го?" autocomplete="off">

  <div class="stage">
    <button class="ball" id="ball" aria-label="Потрясти шар">
      <div class="window" id="win"><div class="eight" id="eight">8</div></div>
    </button>
  </div>

  <p class="hint" id="hint">Нажми на шар или потряси телефон</p>
  <p class="answer" id="answer" aria-live="polite"></p>

  <ul class="hist" id="hist"></ul>

  <p class="foot">Доказательность: уровень F, сила рекомендации — никакая 🙂</p>
</main>

<script>
const ANSWERS = {
  classic: [
    "Бесспорно","Предрешено","Никаких сомнений","Определённо да","Можешь быть уверен",
    "Мне кажется — да","Вероятнее всего","Хорошие перспективы","Знаки говорят — да","Да",
    "Пока не ясно, попробуй снова","Спроси позже","Лучше не рассказывать","Сейчас нельзя предсказать","Сконцентрируйся и спроси опять",
    "Даже не думай","Мой ответ — нет","По моим данным — нет","Перспективы не очень","Весьма сомнительно"
  ],
  rodblok: [
    "КТГ нормальная — ждём","Физиология рулит","Однозначно да, как полное открытие","Шейка не готова — нет",
    "Сначала УЗИ","Только через консилиум","Звони заведующему","Это к анестезиологу",
    "Спроси акушерку, она уже знает","Партограмма говорит да","Вакуум решит","Запиши в историю и выдохни",
    "Утро вечера мудренее","Не трогай — само родится","Сначала кофе","Это 31-я неделя вопроса, рано",
    "Время пошло — действуй","Пересмотри через 2 часа","Да, но протокол ВК готовь","Нет. Совсем нет"
  ],
  astro: [
    "Звёзды говорят да","Меркурий ретроградный — не сейчас","Луна в Скорпионе — рискни","Венера против",
    "Сатурн советует подождать","Марс за — действуй","Юпитер благословляет","Твой асцендент сомневается",
    "Карта ясна: да","Это кармический урок — нет","Вселенная уже ответила","Нептун туманит — спроси позже",
    "Плутон говорит: перемены","Солнце в зените — да","Дом удачи пуст — не сегодня","Звёзды склоняют, но не обязывают"
  ]
};

let mode = "classic";
let busy = false;
const ball = document.getElementById("ball");
const win = document.getElementById("win");
const answerEl = document.getElementById("answer");
const hint = document.getElementById("hint");
const hist = document.getElementById("hist");
const q = document.getElementById("q");
let lastIdx = -1;

document.querySelectorAll(".modes button").forEach(b=>{
  b.addEventListener("click",()=>{
    mode = b.dataset.mode;
    document.querySelectorAll(".modes button").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
    resetBall();
    try{localStorage.setItem("shar-mode",mode)}catch(e){}
  });
});
try{
  const saved = localStorage.getItem("shar-mode");
  if(saved && ANSWERS[saved]){
    document.querySelector(`[data-mode="${saved}"]`).click();
  }
}catch(e){}

function resetBall(){
  win.innerHTML = '<div class="eight">8</div>';
  answerEl.textContent = "";
  hint.textContent = "Нажми на шар или потряси телефон";
}

function pick(){
  const list = ANSWERS[mode];
  let i;
  do{ i = Math.floor(Math.random()*list.length) }while(i===lastIdx && list.length>1);
  lastIdx = i;
  return list[i];
}

function ask(){
  if(busy) return;
  busy = true;
  hint.textContent = "Шар думает…";
  answerEl.textContent = "";
  win.innerHTML = "";
  ball.classList.remove("shake"); void ball.offsetWidth; ball.classList.add("shake");
  if(navigator.vibrate) try{navigator.vibrate([40,40,40])}catch(e){}
  setTimeout(()=>{
    const a = pick();
    const tri = document.createElement("div");
    tri.className = "tri";
    tri.innerHTML = "<span></span>";
    tri.firstChild.textContent = a;
    win.appendChild(tri);
    requestAnimationFrame(()=>requestAnimationFrame(()=>tri.classList.add("show")));
    answerEl.textContent = a;
    hint.textContent = "Ещё вопрос? Тряхни снова";
    const question = q.value.trim();
    const li = document.createElement("li");
    li.innerHTML = "<b></b><span></span>";
    li.querySelector("b").textContent = question || "Без вопроса";
    li.querySelector("span").textContent = a;
    hist.prepend(li);
    while(hist.children.length>5) hist.lastChild.remove();
    busy = false;
  }, 950);
}

ball.addEventListener("click", ()=>{ enableMotion(); ask(); });
q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ q.blur(); ask(); } });

// Встряска телефона
let motionOn = false, lastShake = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration; if(!a) return;
  const f = Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
  const now = Date.now();
  if(f>38 && now-lastShake>1500){ lastShake = now; ask(); }
}
function enableMotion(){
  if(motionOn || typeof DeviceMotionEvent==="undefined") return;
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(s=>{
      if(s==="granted"){ window.addEventListener("devicemotion",onMotion); motionOn = true; }
    }).catch(()=>{});
  }else{
    window.addEventListener("devicemotion",onMotion); motionOn = true;
  }
}
enableMotion();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
